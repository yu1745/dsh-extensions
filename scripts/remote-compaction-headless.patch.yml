# Test-only overlay. Leaves the user's headless profile files unchanged.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai-codex:
        models:
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 512000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.1-terra
            name: GPT-6.1 Terra
            contextWindow: 512000
            maxTokens: 64000
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true
- id: yu-codex-fast
  name: '@yu1745/dsh-extensions/codex-fast'
  disabled: true
- id: headless-runner
  name: '@deepseek-ai/dsh-headless'
  disabled: true
- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-llm'
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: /home/wangyu/dsh-extensions/scripts/remote-headless-sessions
- insert:
    - id: smoke-remote-compaction
      name: /home/wangyu/dsh-extensions/scripts/remote-compaction-headless-smoke.mjs
