# == @deepseek-ai/dsh-base, patched by /home/wangyu/.dsh/profiles/headless/cordis.patch.yml
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      river:
        displayName: River
        apiKeyEnv: RIVER_API_KEY
        api: openai-completions
        baseURL: https://api.river.ai/v1
        requestImagePixelBudget: 4000000
        requestImageMaxBytes: 4718592
        models:
          - id: deepseek-ai/DeepSeek-V4.1-Flash
            name: DeepSeek V4.1 Flash (River)
            contextWindow: 1048576
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              'off': none
              low: low
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
              supportsReasoningEffort: true
          - id: zai-org/GLM-5.3-Flash
            name: GLM-5.3-Flash (River)
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              'off': null
              low: low
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              maxTokensField: max_tokens
              thinkingFormat: zai
              supportsStrictMode: true
      zai-coding-cn:
        displayName: Z.AI Coding CN
        apiKeyEnv: ZAI_CODING_CN_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        reasoning: low
        requestImagePixelBudget: 4000000
        requestImageMaxBytes: 4718592
        models:
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: glm-5.3-flashx
            name: GLM-5.3-FlashX
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          thinkingFormat: zai
          supportsStrictMode: true
      minimax-cn:
        displayName: MiniMax CN
        apiKeyEnv: MINIMAX_CN_API_KEY
        api: anthropic-messages
        baseURL: https://api.minimaxi.com/anthropic
        reasoning: low
        models:
          - id: MiniMax-M3.1-Flash-Preview
            name: MiniMax-M3.1-Flash-Preview
            contextWindow: 1000000
            maxTokens: 512000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              forceAdaptiveThinking: true
